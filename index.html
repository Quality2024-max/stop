<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mobile Responsive Timer</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:15px;
    }

    .container{
      width:100%;
      max-width:400px;
      background:#111827;
      border-radius:25px;
      padding:20px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    h1{
      margin-bottom:20px;
      font-size:28px;
    }

    /* =========================
       RESPONSIVE TIMER
    ========================= */

    .timer-wrapper{
      position:relative;

      width:70vw;
      height:70vw;

      max-width:260px;
      max-height:260px;

      margin:auto;
    }

    svg{
      width:100%;
      height:100%;
      transform:rotate(-90deg);
    }

    circle{
      fill:none;
      stroke-width:10;
      stroke-linecap:round;
    }

    .bg{
      stroke:#1e293b;
    }

    .progress{
      stroke:#38bdf8;
      stroke-dasharray:754;
      stroke-dashoffset:0;
      transition:1s linear;
    }

    .timer-display{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);

      font-size:clamp(28px, 8vw, 52px);
      font-weight:700;
    }

    /* INPUTS */

    .inputs{
      margin-top:25px;
      display:flex;
      gap:10px;
    }

    .inputs input{
      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#1e293b;
      color:white;
      text-align:center;
      font-size:16px;
      outline:none;
    }

    /* BUTTONS */

    .buttons{
      margin-top:20px;

      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    button{
      border:none;
      padding:14px;
      border-radius:12px;
      font-size:16px;
      font-weight:600;
      color:white;
      cursor:pointer;
    }

    .start{
      background:#22c55e;
    }

    .pause{
      background:#f59e0b;
    }

    .stop{
      background:#8b5cf6;
    }

    .reset{
      background:#ef4444;
    }

    /* MOBILE FIX */

    @media(max-width:480px){

      .container{
        padding:15px;
      }

      .inputs{
        flex-direction:column;
      }

      .buttons{
        grid-template-columns:1fr;
      }

      button{
        width:100%;
      }

      .timer-wrapper{
        width:75vw;
        height:75vw;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Countdown Timer</h1>

    <!-- TIMER -->
    <div class="timer-wrapper">

      <svg viewBox="0 0 300 300">

        <!-- Background -->
        <circle
          class="bg"
          cx="150"
          cy="150"
          r="120">
        </circle>

        <!-- Progress -->
        <circle
          class="progress"
          cx="150"
          cy="150"
          r="120">
        </circle>

      </svg>

      <!-- Timer Text -->
      <div class="timer-display" id="timer">
        00:00
      </div>

    </div>

    <!-- INPUTS -->
    <div class="inputs">

      <input
        type="number"
        id="minutes"
        placeholder="Minutes">

      <input
        type="number"
        id="seconds"
        placeholder="Seconds">

    </div>

    <!-- BUTTONS -->
    <div class="buttons">

      <button class="start" onclick="startTimer()">
        Start
      </button>

      <button class="pause" onclick="pauseTimer()">
        Pause
      </button>

      <button class="stop" onclick="stopTimer()">
        Stop
      </button>

      <button class="reset" onclick="resetTimer()">
        Reset
      </button>

    </div>

  </div>

  <!-- Alarm -->
  <audio id="alarmSound">
    <source
      src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
      type="audio/ogg">
  </audio>

  <script>

    let timer;

    let totalTime = 0;

    let remainingTime = 0;

    let isRunning = false;

    // Circle Setup
    const circle = document.querySelector(".progress");

    const radius = 120;

    const circumference = 2 * Math.PI * radius;

    circle.style.strokeDasharray = circumference;

    // FORMAT MM:SS
    function formatTime(time){

      let minutes = Math.floor(time / 60);

      let seconds = time % 60;

      return (
        String(minutes).padStart(2,'0')
        + ":" +
        String(seconds).padStart(2,'0')
      );
    }

    // UPDATE DISPLAY
    function updateDisplay(){

      document.getElementById("timer").innerText =
        formatTime(remainingTime);

      let progress =
        circumference -
        (remainingTime / totalTime) * circumference;

      circle.style.strokeDashoffset = progress;
    }

    // START
    function startTimer(){

      if(isRunning){
        return;
      }

      const mins =
        parseInt(document.getElementById("minutes").value) || 0;

      const secs =
        parseInt(document.getElementById("seconds").value) || 0;

      if(remainingTime === 0){

        totalTime = (mins * 60) + secs;

        remainingTime = totalTime;
      }

      if(totalTime <= 0){

        alert("Enter valid time");

        return;
      }

      isRunning = true;

      timer = setInterval(() => {

        if(remainingTime > 0){

          remainingTime--;

          updateDisplay();

        } else {

          clearInterval(timer);

          isRunning = false;

          document
            .getElementById("alarmSound")
            .play();

          alert("Time's Up!");
        }

      },1000);
    }

    // PAUSE
    function pauseTimer(){

      clearInterval(timer);

      isRunning = false;
    }

    // STOP
    function stopTimer(){

      clearInterval(timer);

      isRunning = false;

      totalTime = 0;

      remainingTime = 0;

      document.getElementById("timer")
        .innerText = "00:00";

      circle.style.strokeDashoffset = 0;
    }

    // RESET
    function resetTimer(){

      clearInterval(timer);

      isRunning = false;

      totalTime = 0;

      remainingTime = 0;

      document.getElementById("minutes").value = "";

      document.getElementById("seconds").value = "";

      document.getElementById("timer")
        .innerText = "00:00";

      circle.style.strokeDashoffset = 0;
    }

  </script>

</body>
</html>
